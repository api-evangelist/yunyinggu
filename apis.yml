name: Yunyinggu (Viewtrix Technology)
description: >-
  Yunyinggu Technology (云英谷科技), which rebranded as Viewtrix Technology, is a
  Shenzhen-based fabless semiconductor company founded in 2012 that designs
  AMOLED display driver integrated circuits (DDIC) and color-rendering display
  solutions for smartphones and other devices. By 2024 sales volume it was the
  largest AMOLED display driver chip supplier in mainland China and the
  fifth-largest globally, with R&D and operations across Shenzhen, Shanghai,
  Beijing, and Hong Kong. Backed by Qiming Venture Partners (Series C and
  extension), Huawei, and Xiaomi, the company completed a Hong Kong IPO. It is a
  hardware/semiconductor business and publishes no public developer API surface;
  this profile is retained as a network identity record. The original
  yunyinggu.com domain no longer resolves and viewtrix.com is a parked
  domain-for-sale listing.
